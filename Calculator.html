<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALC PRO | ELITE</title>
    <style>
        :root { --bg: #030303; --accent: #0a84ff; --glass: rgba(255, 255, 255, 0.08); --gold: #ffcc00; --text: #f5f5f7; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }

        /* CALCULATOR UI */
        .calc-body { background: #1c1c1e; padding: 25px; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1); width: 340px; border: 1px solid #2c2c2e; box-sizing: border-box; }
        .display { background: transparent; padding: 40px 15px 10px 15px; text-align: right; font-size: 3.8rem; font-weight: 300; margin-bottom: 10px; color: #fff; min-height: 90px; overflow-x: hidden; letter-spacing: -2px; }
        
        /* THE BUTTON GRID - Fixed width and margin auto for centering */
        .btn-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 14px; 
            width: 290px; /* Fixed width to match 4 columns + gaps */
            margin: 0 auto; /* This centers the grid within the calc-body */
        }
        
        button { width: 62px; height: 62px; border-radius: 50%; border: none; background: #333336; color: white; font-size: 1.5rem; font-weight: 500; cursor: pointer; transition: 0.15s; display: flex; justify-content: center; align-items: center; padding: 0; }
        button:active { transform: scale(0.9); filter: brightness(1.5); }
        
        .op-btn { color: #fff; background: #ff9f0a; font-size: 1.8rem; }
        .top-btn { background: #a5a5a7; color: #000; }
        .zero-btn { grid-column: span 2; width: 138px; border-radius: 40px; justify-content: flex-start; padding-left: 25px; }

        /* OVERLAY & MODALS */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: #1c1c1e; width: 85%; max-width: 350px; padding: 35px; border-radius: 30px; border: 1px solid #333; text-align: center; display: none; animation: ultraPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes ultraPop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        .tier { background: #2c2c2e; border: 2px solid transparent; padding: 18px; border-radius: 16px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .tier:hover { border-color: var(--accent); }
        .best-value { border-color: var(--accent); background: rgba(10, 132, 255, 0.1); }
        input { width: 85%; background: #000; border: 1px solid #444; color: #fff; padding: 16px; border-radius: 12px; margin: 15px 0; outline: none; text-align: center; }
        .action-btn { width: 100%; padding: 18px; background: var(--accent); color: #fff; border-radius: 14px; font-weight: 700; margin-top: 10px; border: none; cursor: pointer; }
        .id-btn { background: #2c2c2e; border: 1px solid #444; color: #fff; border-radius: 14px; margin-bottom: 10px;}
        .loading-text { font-family: monospace; color: #34c759; margin-top: 25px; }
        .spinner { width: 45px; height: 45px; border: 4px solid #333; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .confetti-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; display: none; z-index: 150; }
        .confetti { position: absolute; width: 12px; height: 24px; animation: fall linear forwards; }
        @keyframes fall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(1080deg); opacity: 0; } }
    </style>
</head>
<body>

<div class="calc-body">
    <div class="display" id="display">0</div>
    <div class="btn-grid">
        <button class="top-btn" onclick="clearCalc()">AC</button>
        <button class="top-btn" onclick="sfxClick()">+/-</button>
        <button class="top-btn" onclick="sfxClick()">%</button>
        <button class="op-btn" onclick="press('/')">÷</button>
        <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op-btn" onclick="press('*')">×</button>
        <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op-btn" onclick="press('-')">-</button>
        <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op-btn" onclick="press('+')">+</button>
        <button class="zero-btn" onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="op-btn" onclick="startExtortion()">=</button>
    </div>
</div>

<div class="overlay" id="overlay">
    <div class="modal" id="step-pricing">
        <div style="font-size: 3.5rem; margin-bottom: 5px;">💳</div>
        <h2 style="margin: 0 0 5px 0;">PAYMENT REQUIRED</h2>
        <p style="color: #888; font-size: 0.9rem; margin-bottom: 25px;">Calculation limits exceeded. Purchase a package to decrypt your answer.</p>
        <div class="tier" onclick="selectTier('$300')"><div>Single Answer</div><div style="font-weight: 800;">$300</div></div>
        <div class="tier best-value" onclick="selectTier('$500')"><div>Daily Sub</div><div style="font-weight: 800; color: var(--accent);">$500</div></div>
        <div class="tier" onclick="selectTier('$2,000')"><div>10 Credits</div><div style="font-weight: 800;">$2,000</div></div>
    </div>
    <div class="modal" id="step-email">
        <h2>VERIFY ACCOUNT</h2>
        <input type="email" placeholder="Enter Email" id="fakeEmail">
        <button class="action-btn" onclick="showCodeInput()">SEND CODE</button>
        <div id="code-section" style="display:none; margin-top: 20px;">
            <input type="number" placeholder="Enter Code">
            <button class="action-btn" onclick="nextStep('step-id')">VERIFY</button>
        </div>
    </div>
    <div class="modal" id="step-id">
        <div style="font-size: 3rem;">🛂</div>
        <h2>IDENTITY CHECK</h2>
        <button class="action-btn id-btn" id="btn-phys" onclick="scanFake('phys')">📸 SCAN ID</button>
        <button class="action-btn id-btn" id="btn-dig" onclick="scanFake('dig')">👁️ BIOMETRIC SCAN</button>
        <button class="action-btn" id="btn-id-next" style="display:none; background: #34c759;" onclick="nextStep('step-processing'); startProcessing();">AUTHORIZE</button>
    </div>
    <div class="modal" id="step-processing">
        <div class="spinner"></div>
        <h2 style="margin-top: 25px;">PROCESSING</h2>
        <div class="loading-text" id="loadingText">Connecting to bank...</div>
    </div>
    <div class="modal" id="step-success">
        <div style="font-size: 5rem;">✅</div>
        <h2 style="color: #34c759;">SECURED</h2>
        <p style="color: #888;">Transaction <b id="final-price" style="color:#fff;">$0</b> verified.</p>
        <button class="action-btn" onclick="showResults()" style="background: #34c759;">VIEW ANSWER</button>
    </div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>
    let equation = "";
    let chosenPrice = "$2,000"; 
    let scansDone = 0;
    let actx = null;

    function getActx() {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        return actx;
    }

    function playTone(freq, type, duration, vol=0.08) {
        try {
            const context = getActx();
            let osc = context.createOscillator();
            let gain = context.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, context.currentTime);
            gain.gain.setValueAtTime(vol, context.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + duration);
            osc.connect(gain); gain.connect(context.destination);
            osc.start(); osc.stop(context.currentTime + duration);
        } catch(e) {}
    }

    const sfxClick = () => playTone(800, 'sine', 0.08);
    const sfxPop = () => { playTone(400, 'square', 0.1, 0.05); setTimeout(()=>playTone(600, 'square', 0.1, 0.05), 100); };
    const sfxSuccess = () => { [523, 659, 783].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.4, 0.1), i * 120)); };

    function press(char) { sfxClick(); let d = document.getElementById("display"); if (d.innerText === "0" && !isNaN(char)) { d.innerText = char; equation = char; } else { d.innerText += char; equation += char; } }
    function clearCalc() { sfxClick(); document.getElementById("display").innerText = "0"; equation = ""; }
    function startExtortion() { sfxPop(); document.getElementById("overlay").style.display = "flex"; nextStep('step-pricing'); }
    function selectTier(price) { sfxClick(); chosenPrice = price; nextStep('step-email'); }
    function nextStep(stepId) { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); document.getElementById(stepId).style.display = "block"; }
    function showCodeInput() { sfxClick(); document.getElementById("code-section").style.display = "block"; }

    function scanFake(type) {
        sfxClick();
        let btn = document.getElementById(type === 'phys' ? 'btn-phys' : 'btn-dig');
        btn.innerText = "⏳ SCANNING...";
        setTimeout(() => {
            sfxClick(); btn.innerText = "✅ VERIFIED"; btn.style.color = "#34c759"; btn.disabled = true;
            scansDone++; if(scansDone === 2) document.getElementById("btn-id-next").style.display = "block";
        }, 1200);
    }

    function startProcessing() {
        let texts = ["Encrypting...", "Bypassing Limits...", "Authorizing $"+chosenPrice+"...", "Done."];
        let i = 0;
        let interval = setInterval(() => {
            if (i < texts.length) { document.getElementById("loadingText").innerText = texts[i]; i++; } 
            else { clearInterval(interval); document.getElementById("final-price").innerText = chosenPrice; nextStep('step-success'); sfxSuccess(); launchMassiveConfetti(); }
        }, 1100);
    }

    function launchMassiveConfetti() {
        const container = document.getElementById("confetti"); container.style.display = "block";
        for (let i = 0; i < 150; i++) {
            let conf = document.createElement("div"); conf.className = "confetti";
            conf.style.left = Math.random() * 100 + "vw"; conf.style.backgroundColor = ['#0a84ff', '#ff2d55', '#ffcc00', '#34c759', '#ffffff'][Math.floor(Math.random()*5)];
            conf.style.animationDuration = (Math.random() * 2 + 1.5) + "s";
            container.appendChild(conf);
        }
    }

    function showResults() {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("confetti").innerHTML = "";
        try { let res = eval(equation); document.getElementById("display").innerText = res; equation = res; } catch(e) { document.getElementById("display").innerText = "ERR"; }
    }
</script>
</body>
</html>
